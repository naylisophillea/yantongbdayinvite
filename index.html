<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yantong — Eighteen</title>
<meta name="description" content="You're invited. Yantong turns eighteen, 25 September.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="petal-field" aria-hidden="true"></div>
<div id="cursor-glow" aria-hidden="true"></div>

<header class="chrome">
  <span>made by ns</span>
  <a href="party.html">Detail page →</a>
</header>

<main>
  <section class="hero">
    <div class="hero-image" role="img" aria-label="Pink lily blossoms against a dark background"></div>

    <div class="hero-content">
      <p class="eyebrow">you're invited to</p>
      <h1 class="hero-name">Yan's Birthday Party<span class="num">chapter eighteen</span></h1>
      <p class="hero-line">But mostly I hate the way I don't hate you — not even close, not even a little bit, not even at all.</p>

      <div class="hero-meta">
        <div>
          <span class="label">Date</span>
          <span class="value">25 Sept</span>
        </div>
        <div>
          <span class="label">Time</span>
          <span class="value">6:00 PM</span>
        </div>
        <div>
          <span class="label">Where</span>
          <span class="value">Tierra Vue</span>
        </div>
      </div>

      <div class="hero-actions">
        <a class="btn" href="party.html">Details</a>
        <div class="countdown-strip" id="countdown" aria-live="polite">
          <div class="unit"><span class="num" data-unit="d">–</span><span class="unit-label">days</span></div>
          <div class="unit"><span class="num" data-unit="h">–</span><span class="unit-label">hrs</span></div>
          <div class="unit"><span class="num" data-unit="m">–</span><span class="unit-label">min</span></div>
        </div>
      </div>
    </div>
  </section>


</main>

<script src="script.js"></script>
</body>
</html>
